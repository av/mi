# Reference harness: Terminus 2 + DeepSeek-V3.2, matched to the TB 2.0 leaderboard
# entry (39.6%; job 2026-02-07__07-47-43 in huggingface.co/datasets/
# harborframework/terminal-bench-2-leaderboard, Terminus2__DeepSeek-V3.2).
# That run used deepseek/deepseek-chat (V3.2, non-thinking) on DeepSeek's API and
# Harbor 0.1.x, whose terminus-2 defaulted to temperature 0.7. DeepSeek's API no
# longer serves V3.2, so this pins the FP8 weights on OpenRouter/GMICloud.
agents:
  - name: terminus-2
    model_name: openrouter/deepseek/deepseek-v3.2
    kwargs:
      temperature: 0.7
      llm_call_kwargs:
        extra_body:
          provider: {order: [gmicloud], allow_fallbacks: false}
