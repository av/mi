# Evaluation egress control, added to every trial with `environment.extra_docker_compose` (see
# bench/configs/egress.yaml). The task container (`main`) shares the network namespace of `mi-egress`, which
# redirects all of its outbound TCP into shim.py; `main` has neither NET_ADMIN nor NET_RAW, so nothing running
# in it — whatever user, shell, interpreter or child process — can change or sidestep the rules.
# Build the image first: bench/egress/build.sh
services:
  mi-egress-proxy:
    image: mi-egress:1
    command: ["proxy"]
    environment:
      MI_EGRESS_DENY: 'terminal[-_. ]?bench|laude-institute|harbor-framework|(?<![a-z])tbench(?![a-z])'
      # the model API: its request bodies hold the whole conversation, so only their URL is matched
      MI_EGRESS_MODEL_HOSTS: '(^|\.)openrouter\.ai$$'
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2)"]
      interval: 1s
      timeout: 5s
      retries: 60
  mi-egress:
    image: mi-egress:1
    command: ["shim"]
    init: true
    cap_add: [NET_ADMIN]
    environment:
      MI_EGRESS_PROXY: mi-egress-proxy:8080
      # watched source families: their addresses may only be reached under these names
      MI_EGRESS_WATCH: '(^|\.)(github\.com|githubusercontent\.com|github\.io|githubassets\.com|huggingface\.co|jsdelivr\.net|githack\.com|statically\.io|sourcegraph\.com|archive\.org|gitlab\.com|bitbucket\.org|codeberg\.org|tbench\.ai|harborframework\.com|mi-fixture)$$'
      # addresses that may only be reached under a watched name (GitHub's published ranges + resolved names)
      MI_EGRESS_SOURCE_NETS: '140.82.112.0/20 143.55.64.0/20 185.199.108.0/22 192.30.252.0/22 2a0a:a440::/29 2606:50c0::/32'
      MI_EGRESS_SOURCE_HOSTS: 'github.com api.github.com codeload.github.com raw.githubusercontent.com gist.github.com objects.githubusercontent.com tbench.ai www.tbench.ai mi-fixture'
    depends_on:
      mi-egress-proxy: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "test", "-f", "/run/mi-egress/ready"]
      interval: 1s
      timeout: 5s
      retries: 60
  main:
    network_mode: "service:mi-egress"
    cap_drop: [NET_RAW]
    depends_on:
      mi-egress: {condition: service_healthy}
